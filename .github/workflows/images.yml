# Publishes the LifeOS images to ghcr.io/mozyn/lifeos-{api,web,searxng} on every tag (v*): the
# compose-only edition pulls them, so a tag is a release. Build from src/ (the portable source).
name: images

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          for target in api web; do
            docker buildx build --platform linux/amd64,linux/arm64 -f src/docker/Dockerfile \
              --target "$target" --build-arg LIFEOS_BUILD="$TAG" \
              -t ghcr.io/mozyn/lifeos-$target:latest -t ghcr.io/mozyn/lifeos-$target:"$TAG" \
              --push src
          done
          docker buildx build --platform linux/amd64,linux/arm64 -f src/docker/searxng/Dockerfile \
            -t ghcr.io/mozyn/lifeos-searxng:latest -t ghcr.io/mozyn/lifeos-searxng:"$TAG" \
            --push src/docker/searxng
