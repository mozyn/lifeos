# LifeOS (compose-only edition): three containers pulled from ghcr.io/mozyn/lifeos, your notes
# folder mounted at /vault. No build and no source needed: this one file is the app.
# The app on GitHub: https://github.com/mozyn/lifeos
#
# New install: this one file is the app. Edit the LIFEOS_VAULT_HOST line (default ./notes: a
# starter-notes folder made beside this file) to your notes folder, then
#   docker compose up -d     open http://<this machine>:8480/lifeos
# On the first start the stack makes its own secrets and puts the starter notes in an empty notes
# folder. .env is optional: every other setting has a default (see .env for the list).
# README.md: "Install on a NAS" for ZimaOS/TrueNAS/Unraid, "Connect Hermes" for the AI part.
# To run a newer version: set LIFEOS_IMAGE_TAG in .env (the tags are on the GitHub releases page).
name: ${LIFEOS_NAME:-lifeos}

services:
  api:
    image: ghcr.io/mozyn/lifeos-api:${LIFEOS_IMAGE_TAG:-latest}
    container_name: ${LIFEOS_NAME:-lifeos}-api
    # the notes' owner (LIFEOS_UID/GID), so files written in the vault stay theirs
    user: "${LIFEOS_UID:-1000}:${LIFEOS_GID:-1000}"
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      LIFEOS_VAULT: /vault
      LIFEOS_DATA: /data
      LIFEOS_AUTH_FILE: /auth/.env.auth
      LIFEOS_MODE: ${LIFEOS_MODE:-live}
      LIFEOS_TELEGRAM: ${LIFEOS_TELEGRAM:-on}
      LIFEOS_AI: ${LIFEOS_AI:-on}
      LIFEOS_PUBLIC_URL: ${LIFEOS_PUBLIC_URL:-http://localhost:${LIFEOS_PORT:-8480}/lifeos}
      LIFEOS_SEARXNG_URL: http://lifeos-searxng:8080
      LIFEOS_SETUP_SEED: ${LIFEOS_SETUP_SEED:-}
      # the Hermes prompt names this container, its network and the published port (ADR-88)
      LIFEOS_NAME: ${LIFEOS_NAME:-lifeos}
      LIFEOS_PORT: ${LIFEOS_PORT:-8480}
      # 0.0.0.0: the app says once that plain http cannot install it or notify (product brief 10 §2)
      LIFEOS_BIND: ${LIFEOS_BIND:-127.0.0.1}
      LIFEOS_STARTER: ${LIFEOS_STARTER:-on}
    env_file:
      # the model endpoint (.env.ai; an older .env.gsq still works), Telegram, browser notifications
      - path: ${LIFEOS_ENV_AI:-.env.ai}
        required: false
      - path: ${LIFEOS_ENV_GSQ:-.env.gsq}
        required: false
      - path: ${LIFEOS_ENV_TELEGRAM:-.env.telegram}
        required: false
      - path: ${LIFEOS_ENV_PUSH:-.env.push}
        required: false
    volumes:
      - ${LIFEOS_VAULT_HOST:-./notes}:/vault:rw
      - data:/data
      # the passphrase file (.env.auth): in the data volume, or in LIFEOS_AUTH_DIR when it is set
      - ${LIFEOS_AUTH_DIR:-data}:/auth:rw
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      default:
        aliases: [lifeos-api]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8481/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    image: ghcr.io/mozyn/lifeos-web:${LIFEOS_IMAGE_TAG:-latest}
    container_name: ${LIFEOS_NAME:-lifeos}-web
    restart: unless-stopped
    ports:
      - "${LIFEOS_BIND:-127.0.0.1}:${LIFEOS_PORT:-8480}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 4s
      retries: 6
      start_period: 5s

  searxng:
    image: ghcr.io/mozyn/lifeos-searxng:${LIFEOS_IMAGE_TAG:-latest}
    container_name: ${LIFEOS_NAME:-lifeos}-searxng
    user: "977:977"
    restart: unless-stopped
    # its secret: SEARXNG_SECRET from .env.searxng, else made on the first start (the image's
    # baked-in start.sh keeps it in the searxng-etc volume)
    environment:
      SEARXNG_SETTINGS_PATH: /lifeos/settings.yml
      __SEARXNG_SETTINGS_PATH: /lifeos/settings.yml
      FORCE_OWNERSHIP: "false"
    env_file:
      - path: .env.searxng
        required: false
    volumes:
      - searxng-etc:/etc/searxng
      - searxng-cache:/var/cache/searxng
    networks:
      default:
        aliases: [lifeos-searxng]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 15s

volumes:
  data:
    name: ${LIFEOS_DATA_VOLUME:-${LIFEOS_NAME:-lifeos}-data}
  searxng-etc:
    name: ${LIFEOS_NAME:-lifeos}-searxng-etc
  searxng-cache:
    name: ${LIFEOS_NAME:-lifeos}-searxng-cache

networks:
  default:
    name: ${LIFEOS_NAME:-lifeos}-net
