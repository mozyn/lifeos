# LifeOS: https://github.com/mozyn/lifeos
#
# Install: save this file as compose.yaml, run  docker compose up -d
# then open http://<your server's address>:8480 from any device on your network and choose a
# passphrase. In Dockge, the 8480 link on the stack opens it. Nothing here needs changing.
#
# Optional edits:
# - Your own notes (an Obsidian vault or any folder of .md files): on the line marked
#   "your notes", replace the word notes with the folder's path, for example /home/sara/Notes.
#   Without that, LifeOS starts with sample notes stored inside Docker.
# - Port 8480 taken: change 8480 on the "ports:" line (the left-hand number) to a free one.
# - Your notes folder belongs to a user other than 1000 (TrueNAS 568, Unraid 99:100): change the
#   two 1000s on the "user:" line to its owner.
name: ${LIFEOS_NAME:-lifeos}

services:
  api:
    image: ghcr.io/mozyn/lifeos-api:${LIFEOS_IMAGE_TAG:-latest}
    container_name: ${LIFEOS_NAME:-lifeos}-api
    user: "${LIFEOS_UID:-1000}:${LIFEOS_GID:-1000}"
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      LIFEOS_VAULT: /vault
      LIFEOS_DATA: /data
      LIFEOS_AUTH_FILE: /auth/.env.auth
      LIFEOS_MODE: ${LIFEOS_MODE:-live}
      LIFEOS_TELEGRAM: ${LIFEOS_TELEGRAM:-on}
      LIFEOS_AI: ${LIFEOS_AI:-on}
      LIFEOS_PUBLIC_URL: ${LIFEOS_PUBLIC_URL:-}
      LIFEOS_SEARXNG_URL: http://lifeos-searxng:8080
      LIFEOS_SETUP_SEED: ${LIFEOS_SETUP_SEED:-}
      LIFEOS_NAME: ${LIFEOS_NAME:-lifeos}
      LIFEOS_PORT: ${LIFEOS_PORT:-8480}
      LIFEOS_BIND: ${LIFEOS_BIND:-0.0.0.0}
      LIFEOS_STARTER: ${LIFEOS_STARTER:-on}
    env_file:
      - path: ${LIFEOS_ENV_AI:-.env.ai}
        required: false
      - path: ${LIFEOS_ENV_GSQ:-.env.gsq}
        required: false
      - path: ${LIFEOS_ENV_TELEGRAM:-.env.telegram}
        required: false
      - path: ${LIFEOS_ENV_PUSH:-.env.push}
        required: false
    volumes:
      - ${LIFEOS_VAULT_HOST:-notes}:/vault:rw # your notes
      - data:/data
      - ${LIFEOS_AUTH_DIR:-data}:/auth:rw
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      default:
        aliases: [lifeos-api]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8481/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    image: ghcr.io/mozyn/lifeos-web:${LIFEOS_IMAGE_TAG:-latest}
    container_name: ${LIFEOS_NAME:-lifeos}-web
    restart: unless-stopped
    ports:
      - "${LIFEOS_PORT:-8480}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 4s
      retries: 6
      start_period: 5s

  searxng:
    image: ghcr.io/mozyn/lifeos-searxng:${LIFEOS_IMAGE_TAG:-latest}
    container_name: ${LIFEOS_NAME:-lifeos}-searxng
    user: "977:977"
    restart: unless-stopped
    environment:
      SEARXNG_SETTINGS_PATH: /lifeos/settings.yml
      __SEARXNG_SETTINGS_PATH: /lifeos/settings.yml
      FORCE_OWNERSHIP: "false"
    env_file:
      - path: .env.searxng
        required: false
    volumes:
      - searxng-etc:/etc/searxng
      - searxng-cache:/var/cache/searxng
    networks:
      default:
        aliases: [lifeos-searxng]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 15s

volumes:
  notes:
    name: ${LIFEOS_NAME:-lifeos}-notes
  data:
    name: ${LIFEOS_DATA_VOLUME:-${LIFEOS_NAME:-lifeos}-data}
  searxng-etc:
    name: ${LIFEOS_NAME:-lifeos}-searxng-etc
  searxng-cache:
    name: ${LIFEOS_NAME:-lifeos}-searxng-cache

networks:
  default:
    name: ${LIFEOS_NAME:-lifeos}-net
