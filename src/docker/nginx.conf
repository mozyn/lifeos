# lifeos-web: the built PWA under /lifeos/ and the API under /lifeos/api/.
# The same app also answers without the /lifeos prefix, so it works whether or not the reverse proxy
# in front (tailscale serve --set-path /lifeos) strips the mount path before forwarding.
map $http_x_forwarded_proto $lifeos_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

server {
  listen 8080;
  server_name _;
  server_tokens off;
  absolute_redirect off;
  root /usr/share/nginx/html;
  charset utf-8;
  client_max_body_size 1m;

  gzip on;
  gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;
  gzip_min_length 1024;

  # privacy (spec §3): the page may only talk to its own origin
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; media-src 'self' data: blob:; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Docker's DNS, re-resolved, so a recreated API container is found again without restarting nginx
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $lifeos_api http://lifeos-api:8481;

  location /lifeos/api/ {
    rewrite ^/lifeos(/api/.*)$ $1 break;
    proxy_pass $lifeos_api;
    include /etc/nginx/lifeos-proxy.inc;
  }

  location /api/ {
    proxy_pass $lifeos_api;
    include /etc/nginx/lifeos-proxy.inc;
  }

  location = /lifeos {
    return 301 /lifeos/;
  }

  # hashed build assets never change
  location /lifeos/assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # the shell, the service worker and the manifest are always revalidated
  location ~ ^/lifeos/(index\.html|sw\.js|push-sw\.js|registerSW\.js|manifest\.webmanifest|workbox-[^/]+\.js)$ {
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; media-src 'self' data: blob:; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location /lifeos/ {
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; media-src 'self' data: blob:; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri $uri/ /lifeos/index.html;
  }

  # prefix already stripped by the proxy in front: map onto the same files
  location / {
    rewrite ^/(.*)$ /lifeos/$1 last;
  }
}
